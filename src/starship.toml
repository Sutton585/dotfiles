"$schema" = 'https://starship.rs/config-schema.json'

palette = "cat-mocha"

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$line_break\
$python\
$character"""

right_format = """$cmd_duration"""

add_newline = true

[username]
show_always = false
format = "[$user]($style)@"
style_user = "lavender"

[hostname]
ssh_only = false
format = "[$hostname]($style) "
style = "mauve"
ssh_symbol = ""

[directory]
format = "in [$path]($style) "
style = "bold peach"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](sapphire)"

[git_branch]
format = "[$branch]($style)"
style = "bold lavender"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](red) ($ahead_behind$stashed)]($style)"
style = "yellow"
conflicted = ""
untracked = ""
modified = " "
staged = ""
renamed = ""
deleted = ""
stashed = "≡"

#[git_state]
#format = '\([$state( $progress_current/$progress_total)]($style)\) '
#style = "sky"

[cmd_duration]
min_time = 0
show_milliseconds = true
format = "[$duration]($style) "
style = "subtext0"

[time]
disabled = false
time_format = "%R:%S"
format = "[$time]($style)"
style = "bold subtext0"

[python]
format = "[$virtualenv]($style) "
style = "lavender"
detect_extensions = []
detect_files = []



